{
  "app": {
    "name": "AURUM-1",
    "environment": "development",
    "log_level": "INFO",
    "random_seed": 42
  },
  "broker": {
    "paper_trade": true,
    "paper_initial_equity": 10000.0,
    "oanda": {
      "api_key_env": "OANDA_API_KEY",
      "account_id_env": "OANDA_ACCOUNT_ID",
      "environment_env": "OANDA_ENV",
      "default_environment": "practice",
      "instrument": "XAU_USD",
      "practice_url": "https://api-fxpractice.oanda.com",
      "live_url": "https://api-fxtrade.oanda.com"
    }
  },
  "data": {
    "db_path": "aurum1/data/aurum1.sqlite3",
    "instrument": "XAUUSD",
    "yfinance_symbol": "XAUUSD=X",
    "timeframes": ["M5", "M15", "H1", "H4", "D1"],
    "http_timeout_seconds": 30,
    "retry": {
      "attempts": 3,
      "base_delay_seconds": 0.5,
      "max_delay_seconds": 8.0
    },
    "fred": {
      "api_key_env": "FRED_API_KEY",
      "base_url": "https://api.stlouisfed.org/fred/series/observations",
      "series": {
        "dgs10": "DGS10",
        "cpi": "CPIAUCSL"
      }
    },
    "macro_yfinance": {
      "dxy_symbol": "DX-Y.NYB",
      "vix_symbol": "^VIX"
    },
    "cot": {
      "source_url_template": "https://www.cftc.gov/files/dea/history/fut_disagg_txt_{year}.zip",
      "current_url": "https://www.cftc.gov/dea/newcot/f_disagg.txt",
      "history_years": 2,
      "market_filter": "GOLD"
    },
    "calendar": {
      "source_url": "https://www.investing.com/economic-calendar/",
      "source_name": "investing.com",
      "blackout_window_minutes": 30,
      "currencies": ["USD", "XAU"],
      "high_impact_terms": ["FOMC", "NFP", "NONFARM", "CPI", "GOLD"]
    },
    "news": {
      "api_key_env": "ALPHA_VANTAGE_API_KEY",
      "base_url": "https://www.alphavantage.co/query",
      "limit": 50,
      "topics": "financial_markets,forex",
      "gold_terms": ["gold", "xau", "dollar", "usd", "forex", "fx"]
    }
  },
  "instruments": {
    "XAU_USD": {
      "oanda_instrument": "XAU_USD",
      "account_currency": "USD",
      "pip_size": 0.01,
      "ounces_per_unit": 1.0,
      "units_per_lot": 100.0,
      "min_units": 1.0,
      "max_units": 1000.0,
      "unit_precision": 0,
      "min_lot_size": 0.01,
      "max_lot_size": 10.0,
      "lot_step": 0.01
    }
  },
  "risk": {
    "spread_filter_pips": 3.0,
    "default_spread_pips": 1.5,
    "risk_per_trade_pct": 0.0025,
    "kelly_min_trades": 20,
    "kelly_default_fraction": 0.25,
    "kelly_max_fraction": 0.25,
    "max_spread_pips": 3.0,
    "daily_loss_kill_pct": 0.03,
    "total_drawdown_kill_pct": 0.08,
    "drawdown_recovery_threshold_pct": 0.05,
    "max_portfolio_risk_pct": 3.0,
    "pip_value_per_lot": 1.0,
    "pip_size": 0.01,
    "min_lot_size": 0.01,
    "max_lot_size": 10.0,
    "lot_step": 0.01
  },
  "signals": {
    "adx_threshold": 25,
    "min_pullback_candles": 1,
    "max_pullback_candles": 4,
    "armed_timeout_candles": 20,
    "window_expiry_candles": 6,
    "atr_sl_multiplier": 2.0,
    "atr_tp_multiplier": 3.0,
    "atr_breakout_buffer": 0.3,
    "require_session_filter": true
  },
  "execution": {
    "fill_timeout_candles": 3,
    "slippage_std_pips": 0.5,
    "paper_spread_pips": 1.5
  },
  "models": {
    "enable_direction_predictor": false,
    "enable_sentiment": false,
    "regime": {
      "n_estimators": 300,
      "learning_rate": 0.05,
      "max_depth": 4,
      "num_leaves": 15,
      "min_child_samples": 20,
      "subsample": 0.8,
      "colsample_bytree": 0.8
    }
  },
  "backtesting": {
    "exit_mode": "FIXED",
    "train_bars": 33264,
    "test_bars": 11088,
    "step_bars": 11088,
    "allow_overlap": false,
    "lock_geometry": true,
    "market_data_db_path": "aurum1/data/backtest_market_cache.sqlite3",
    "min_history_bars": 20000,
    "min_history_days": 250,
    "disable_ml": true,
    "verify_feature_causality": true,
    "n_monte_carlo": 1000,
    "min_trades_for_stats": 10
  },
  "monitor": {
    "dashboard_host": "127.0.0.1",
    "dashboard_port": 8501,
    "refresh_interval_sec": 60,
    "rolling_window_days": 30,
    "equity_chart_max_rows": 10000,
    "health_port": 8080
  },
  "orchestrator": {
    "mode": "rule_only",
    "candle_interval_minutes": 15,
    "candle_buffer_seconds": 5,
    "macro_refresh_minutes": 60,
    "sentiment_refresh_minutes": 30,
    "max_consecutive_errors": 10,
    "close_on_shutdown": false,
    "health_port": 8080,
    "retraining_day": 6,
    "retraining_hour": 0,
    "retraining_minute": 0,
    "retraining_window_minutes": 15,
    "log_level": "INFO",
    "log_file": "logs/aurum1.log",
    "shadow_mode": false
  },
  "forward_shadow": {
    "strategy": "raw_donchian_fixed_2r",
    "status": "research_only",
    "paper_trade": true,
    "allow_oanda_orders": false,
    "risk_per_trade_pct": 0.0025,
    "duration_months_min": 3,
    "lookback": 20,
    "exit_mode": "FIXED",
    "direction": "BUY_AND_SELL",
    "parameter_freeze": true,
    "variant_switching_allowed": false,
    "market_data_db_path": "aurum1/data/forward_shadow_market_cache.sqlite3",
    "shadow_db_path": "reports/forward_shadow/donchian_shadow.sqlite3",
    "weekly_report_dir": "reports/forward_shadow",
    "historical_expectations": {
      "net_pnl": 2511.68,
      "profit_factor": 1.15,
      "sharpe": 0.91,
      "max_drawdown": 0.0779,
      "win_rate": 0.378,
      "trade_rate_per_week": 9.8
    },
    "failure_criteria": [
      "execution_or_logging_bugs",
      "trades_differ_from_raw_donchian_fixed_2r_rules",
      "drawdown_exceeds_10_to_15_pct",
      "profit_factor_below_1_0",
      "trade_count_wildly_differs_from_historical_rate",
      "repeated_data_feed_issues"
    ],
    "success_criteria_after_3_months": [
      "net_pnl_positive_or_near_flat_with_acceptable_drawdown",
      "profit_factor_at_least_1_10",
      "sharpe_not_catastrophically_worse_than_backtest",
      "max_drawdown_at_or_below_10_pct",
      "no_execution_realism_issues",
      "trade_count_broadly_consistent_with_historical_expectation",
      "no_manual_intervention_needed"
    ]
  }
}
